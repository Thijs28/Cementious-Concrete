<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Literacy Node Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f1115; color: #e0e0e0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .side-panel {
            position: absolute; top: 0; right: -450px; width: 400px; height: 100%;
            background: rgba(22, 25, 31, 0.95); border-left: 1px solid #333;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5); transition: right 0.4s ease;
            padding: 40px 30px; box-sizing: border-box; overflow-y: auto; z-index: 10;
        }
        .side-panel.active { right: 0; }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 1.5rem; color: #888; border: none; background: transparent; }
        .close-btn:hover { color: #fff; }
        
        #panel-title { font-size: 2rem; margin: 0 0 15px 0; font-weight: 300; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #panel-img { width: 100%; border-radius: 4px; margin-bottom: 20px; display: none; object-fit: cover; }
        #panel-desc { font-size: 1.1rem; line-height: 1.6; color: #bbb; }
        
        .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; transition: fill 0.2s; }
        .node circle:hover { stroke: #ff4757; stroke-width: 3px; }
        .node text { font-size: 12px; pointer-events: none; text-shadow: 1px 1px 3px #000; }
        .link { stroke: #444; stroke-opacity: 0.6; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="panel" class="side-panel">
        <button class="close-btn" onclick="closePanel()">×</button>
        <h2 id="panel-title">Node Title</h2>
        <img id="panel-img" src="" alt="Node Visualization">
        <div id="panel-desc">Description text goes here.</div>
    </div>

    <script>
        // Data Structure: Easily append new nodes and interdependencies here
        const graphData = {
            nodes: [
                { id: "Concrete", group: 0, radius: 25, title: "Cementitious Concrete", desc: "Central material profile.", img: "" },
                { id: "Scientific", group: 1, radius: 15, title: "Scientific Domain", desc: "Mechanical, structural, and thermal properties.", img: "https://via.placeholder.com/400x250/2c3e50/ffffff?text=Microstructure+Scan" },
                { id: "Technical", group: 2, radius: 15, title: "Technical Domain", desc: "Forming methods, energy utilized, and waste generated[cite: 1].", img: "https://via.placeholder.com/400x250/2c3e50/ffffff?text=Kiln+Diagram" },
                { id: "Geo-political", group: 3, radius: 15, title: "Geo-political & Economic", desc: "Extraction sites, trade routes, and monopolies[cite: 1].", img: "" },
                { id: "Historical", group: 4, radius: 15, title: "Historical Domain", desc: "Evolution of production volumes and key innovations[cite: 1].", img: "" },
                { id: "Sensory", group: 5, radius: 15, title: "Sensory Domain", desc: "Optical properties, variances, and spatial qualities[cite: 1].", img: "https://via.placeholder.com/400x250/2c3e50/ffffff?text=Brutalist+Architecture" },
                { id: "Ecological", group: 6, radius: 15, title: "Ecological Domain", desc: "Carbon impact, pollution generated, and end-of-life recovery[cite: 1].", img: "" },
                { id: "Thermal Mass", group: 1, radius: 10, title: "Thermal Capacity", desc: "Concrete absorbs and stores heat energy.", img: "" },
                { id: "Heat Island", group: 6, radius: 10, title: "Urban Heat Island", desc: "Interdependency: High thermal mass contributes to rising urban temperatures.", img: "" }
            ],
            links: [
                { source: "Concrete", target: "Scientific" },
                { source: "Concrete", target: "Technical" },
                { source: "Concrete", target: "Geo-political" },
                { source: "Concrete", target: "Historical" },
                { source: "Concrete", target: "Sensory" },
                { source: "Concrete", target: "Ecological" },
                { source: "Scientific", target: "Thermal Mass" },
                { source: "Ecological", target: "Heat Island" },
                { source: "Thermal Mass", target: "Heat Island" } // Interdependency link
            ]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        const color = d3.scaleOrdinal(d3.schemeSet2);

        const svg = d3.select("#canvas-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => g.attr("transform", event.transform)))
            .append("g");

        const g = svg.append("g");

        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = g.append("g")
            .selectAll("line")
            .data(graphData.links)
            .join("line")
            .attr("class", "link")
            .attr("stroke-width", 2);

        const node = g.append("g")
            .selectAll("g")
            .data(graphData.nodes)
            .join("g")
            .attr("class", "node")
            .call(drag(simulation))
            .on("click", (event, d) => openPanel(d));

        node.append("circle")
            .attr("r", d => d.radius)
            .attr("fill", d => color(d.group));

        node.append("text")
            .attr("dx", 18)
            .attr("dy", ".35em")
            .attr("fill", "#fff")
            .text(d => d.id);

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }
            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }
            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        function openPanel(data) {
            document.getElementById('panel-title').innerText = data.title;
            document.getElementById('panel-desc').innerText = data.desc;
            
            const imgEl = document.getElementById('panel-img');
            if (data.img) {
                imgEl.src = data.img;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }
            document.getElementById('panel').classList.add('active');
        }

        function closePanel() {
            document.getElementById('panel').classList.remove('active');
        }
    </script>
</body>
</html>
