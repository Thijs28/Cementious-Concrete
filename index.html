<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Semantic Knowledge Graph | Cementitious Concrete</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #24272e; 
            --text-primary: #e0e6ed; 
            --text-muted: #9aa2af; 
            --panel-bg: rgba(26, 29, 36, 0.96); 
            --accent: #D4AF37; 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow: hidden; }
        
        svg { user-select: none; -webkit-user-select: none; }

        #graph-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .node-circle { transition: stroke 0.3s, r 0.3s; cursor: pointer; }
        .node-circle:hover { stroke: var(--accent) !important; stroke-width: 3px !important; }
        
        .node-label { font-family: 'EB Garamond', serif; font-size: 14px; fill: var(--text-primary); pointer-events: none; text-shadow: 0 4px 12px rgba(0,0,0,1); transition: opacity 0.3s, font-size 0.4s, fill 0.4s, text-shadow 0.4s; user-select: none; }
        
        .node-label.hub-label { font-size: 22px !important; font-weight: 600; fill: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,1) !important; }
        .node-label.large-label { font-size: 32px !important; font-weight: 600; fill: #ffffff; text-shadow: 0 4px 20px rgba(0,0,0,1), 0 0 15px rgba(212, 175, 55, 0.6) !important; }
        .node-label.medium-label { font-size: 20px !important; font-weight: 400; fill: #f0f4f8; text-shadow: 0 4px 15px rgba(0,0,0,1) !important; }

        .node-label.central-node-text { 
            font-size: 38px !important; 
            font-weight: 700; 
            fill: #FFC300 !important; 
            text-shadow: 0 5px 25px rgba(0,0,0,1), 0 0 20px rgba(255, 195, 0, 0.4) !important; 
        }

        .link-line { stroke: #6b7280; fill: none; transition: stroke-opacity 0.3s, stroke 0.3s, stroke-width 0.3s; }
        .link-label { font-family: 'Inter', sans-serif; font-size: 9px; fill: #9aa2af; text-transform: uppercase; letter-spacing: 1.5px; pointer-events: none; text-anchor: middle; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.3s; user-select: none; }
        
        .show-labels { opacity: 1 !important; }
        .dimmed { opacity: 0.05 !important; transition: opacity 0.4s ease; filter: grayscale(100%); pointer-events: none; }
        .theme-dimmed { opacity: 0.25 !important; transition: opacity 0.4s ease; pointer-events: none; }
        .highlighted { opacity: 1 !important; transition: opacity 0.4s ease; filter: none !important; }
        .highlighted-link { stroke: #cbd5e1 !important; stroke-opacity: 1 !important; }
        
        .force-visible { opacity: 1 !important; pointer-events: auto !important; filter: none !important; }
        
        #top-ribbon {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(26, 29, 36, 0.95); backdrop-filter: blur(15px);
            border-bottom: 1px solid #333945; display: flex; align-items: center;
            padding: 0 30px; box-sizing: border-box; z-index: 90;
            pointer-events: auto; overflow-x: auto; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        #top-ribbon::-webkit-scrollbar { display: none; }
        
        .ribbon-title { position: sticky; left: 0; font-family: 'EB Garamond', serif; color: var(--text-primary); font-size: 1.2rem; padding-right: 30px; white-space: nowrap; user-select: none; flex-shrink: 0; background: linear-gradient(90deg, rgba(26, 29, 36, 1) 80%, rgba(26, 29, 36, 0) 100%); z-index: 2; }
        #legend-items { display: flex; align-items: center; gap: 25px; flex-shrink: 0; padding-right: 40px; }
        .legend-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.75rem; color: var(--text-muted); transition: all 0.2s; user-select: none; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
        
        .legend-item:hover { color: #fff; transform: translateY(-2px); }
        .legend-item.active { color: #fff; font-weight: 600; }
        .legend-number { width: 18px; height: 18px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; flex-shrink: 0; transition: all 0.3s; }
        .legend-item.active .legend-number { background: var(--accent); color: #000; }
        
        #search-container { position: absolute; bottom: 40px; left: 40px; z-index: 50; width: 320px; font-family: 'Inter', sans-serif; pointer-events: auto; }
        #search-input { width: 100%; padding: 15px 20px; border-radius: 8px; border: 1px solid #3b4048; background: rgba(26, 29, 36, 0.85); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; backdrop-filter: blur(15px); outline: none; transition: border-color 0.3s, box-shadow 0.3s; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #search-input:focus { border-color: var(--accent); box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2); }
        #search-input::placeholder { color: #6b7280; }
        #search-results { position: absolute; bottom: 100%; left: 0; width: 100%; background: rgba(26, 29, 36, 0.95); border: 1px solid #3b4048; border-radius: 8px; margin-bottom: 10px; max-height: 250px; overflow-y: auto; display: none; flex-direction: column; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-result-item { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 0.85rem; border-bottom: 1px solid #2d313a; transition: background 0.2s; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }

        #detail-panel { position: absolute; top: 0; right: -750px; width: 600px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(20px); border-left: 1px solid #333945; padding: 80px 45px 120px 45px; box-sizing: border-box; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1); overflow-y: auto; z-index: 100; box-shadow: -15px 0 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        #detail-panel.active { right: 0; }
        
        .close-btn { position: absolute; top: 30px; right: 40px; background: none; border: none; color: var(--text-muted); font-size: 32px; cursor: pointer; z-index: 102; }
        .close-btn:hover { color: var(--text-primary); }
        
        .domain-tag { display: inline-block; padding: 6px 14px; border: 1px solid #333; border-radius: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #fff; margin-bottom: 20px; margin-right: 8px;}
        h1 { font-family: 'EB Garamond', serif; font-size: 2.6rem; font-weight: 400; margin: 0 0 15px 0; }
        .meta-data { font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid #333945; padding-bottom: 20px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;}
        
        .media-container { width: 100%; min-height: 280px; position: relative; background: #000; margin-bottom: 30px; border-radius: 6px; overflow: hidden; border: 1px solid #333945; display: none; }
        .media-container.active { display: block; }
        .media-container img { width: 100%; height: 100%; position: absolute; top: 0; left: 0; object-fit: contain; opacity: 0.95; }
        
        .content-body { font-size: 1.05rem; line-height: 1.7; font-weight: 300; color: #c4c9d0; margin-bottom: 30px; }
        
        .interdependency-list { padding-top: 25px; border-top: 1px solid #333945; display: none; }
        .interdependency-list.active { display: block; }
        .interdependency-list h3 { font-family: 'EB Garamond', serif; font-size: 1.6rem; font-weight: 400; margin-bottom: 15px; }
        .category-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8892a0; border-bottom: 1px solid #333945; padding-bottom: 5px; margin: 25px 0 15px 0; }
        .interdependency-sentence { background: rgba(255,255,255,0.03); border: 1px solid #3b4048; padding: 18px; border-radius: 6px; margin-bottom: 12px; font-size: 1.05rem; line-height: 1.6; color: #b0b8c4; transition: background 0.2s; }
        .interdependency-sentence:hover { background: rgba(255,255,255,0.06); border-color: #545b68; }
        .node-link { font-weight: 600; cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.3); padding-bottom: 2px; transition: color 0.2s; }
        .node-link:hover { opacity: 0.7; }
        .verb-text { font-style: italic; margin: 0 4px; color: #8892a0; }

        .toc-item { background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 20px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .toc-item:hover { background: rgba(212, 175, 55, 0.15); border-color: var(--accent); transform: translateX(5px); }
        .toc-title { font-weight: 600; color: #fff; font-size: 1.1rem; }
        .toc-arrow { color: var(--accent); font-family: monospace; font-size: 1.2rem; }

        #presentation-controls { position: fixed; bottom: 0; right: 0; width: 600px; background: #1f2229; border-top: 1px solid #333945; padding: 20px 45px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); z-index: 101; }
        #presentation-controls.active { transform: translateY(0); }
        .pres-btn { background: #2d313a; color: #fff; border: 1px solid #474e5d; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        .pres-btn:hover { background: #3b4048; border-color: var(--accent); color: var(--accent); }
        .pres-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #pres-counter { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="graph-container"></div>
    
    <div id="top-ribbon">
        <div class="ribbon-title">Thematic Sections</div>
        <div id="legend-items"></div>
    </div>
    
    <div id="search-container">
        <div id="search-results"></div>
        <input type="text" id="search-input" placeholder="Search knowledge graph..." autocomplete="off">
    </div>

    <div id="detail-panel">
        <button class="close-btn" onclick="resetGraph()">×</button>
        <div id="panel-domain-container"></div>
        <h1 id="panel-title"></h1>
        <div class="meta-data" id="panel-meta"></div>
        <div class="media-container" id="panel-media"><img id="panel-img" src="" alt="Data"></div>
        <div class="content-body" id="panel-desc"></div>
        <div class="interdependency-list" id="panel-interdependencies">
            <h3>System Connections</h3>
            <div id="panel-links"></div>
        </div>
    </div>

    <div id="presentation-controls">
        <button class="pres-btn" id="btn-prev" onclick="presPrev()">← Prev</button>
        <span id="pres-counter">Slide 1 / 5</span>
        <button class="pres-btn" id="btn-next" onclick="presNext()">Next →</button>
    </div>

    <script>
        const domainColors = { 
            "Core": "#FFC300",          
            "Scientific": "#00E5FF",    
            "Technical": "#FF3366",     
            "Historical": "#B07DFF",    
            "GeoPolitical": "#FF8C00",  
            "Ecological": "#00FF66",    
            "Sensory": "#FF00FF"        
        };

        const themeDescriptions = {
            "Production of Cement and Concrete": "This section explores the complete manufacturing lifecycle of Portland cement concrete, from the extreme thermochemical reactions in the kiln to the mix design and hydration mechanics that bind the material together.",
            "Concrete as an Architectural Material": "This cluster maps the structural and microstructural properties of concrete that define its performance as a building material, including its strength, porosity, and internal stresses.",
            "Environmental Impact": "This section examines the profound ecological footprint of the concrete industry, detailing emissions, resource depletion, pollution, and the massive scale of its global consumption.",
            "End-of-Life and Circularity": "This cluster explores the fate of concrete after demolition, focusing on degradation pathways, recycling challenges, and the potential for closed-loop material recovery.",
            "Future of Cement and Concrete": "This section highlights cutting-edge strategies and alternative binders aiming to decarbonize the industry and adapt concrete construction to a changing climate.",
            "Origins of Cement": "This historical cluster traces the evolution of cementitious binders, from early lime-based mortars to the invention and standardization of modern Portland cement.",
            "Industrialisation and Global Expansion": "This section maps the rapid technological advancements and massive scaling of cement production during the 19th and 20th centuries.",
            "Labor, Power and Geopolitics": "This thematic cluster unpacks the political economy of concrete, examining the transnational corporations, infrastructure projects, and labor forces that drive global urbanization.",
            "Sensory Experience of Concrete": "This section investigates the aesthetic, tactile, and experiential qualities of concrete, demonstrating how surface finishes and environmental exposure shape architectural atmospheres."
        };
        
        let thematicSubjects = [];
        let presentationData = {};
        
        let currentSubjectFilter = null;
        let presentationQueue = [];
        let presentationIndex = -1;
        
        const width = window.innerWidth;
        const height = window.innerHeight;

        const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", (event) => {
            g.attr("transform", event.transform);
            d3.selectAll('.link-label').classed('show-labels', event.transform.k > 1.2);
        });
        
        const svg = d3.select("#graph-container").append("svg").attr("width", width).attr("height", height).call(zoom);
        const g = svg.append("g");
        const defs = svg.append("defs");

        const topRibbon = document.getElementById('top-ribbon');
        topRibbon.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            topRibbon.scrollLeft += evt.deltaY;
        }, { passive: false });

        topRibbon.addEventListener('scroll', () => {
            const quarter = topRibbon.scrollWidth / 4;
            if (topRibbon.scrollLeft < quarter / 2) {
                topRibbon.scrollLeft += quarter * 2;
            } else if (topRibbon.scrollLeft > quarter * 2.5) {
                topRibbon.scrollLeft -= quarter * 2;
            }
        });

        const strictNormalize = (str) => {
            if(!str) return "";
            return str.replace(/\u00A0/g, ' ') 
                      .replace(/[\r\n\t]+/g, ' ') 
                      .replace(/^\uFEFF/, '') 
                      .trim(); 
        };

        let globalNodes = [];
        let globalLinks = [];
        let globalNodeGroups = null;
        let globalLinkPaths = null;
        let globalLinkTexts = null;

        Promise.all([
            d3.text("nodes.csv").catch(e => { console.error("Missing nodes.csv"); return ""; }),
            d3.text("links.csv").catch(e => { console.error("Missing links.csv"); return ""; }),
            d3.text("presentation.csv").catch(e => { console.error("Missing presentation.csv"); return ""; })
        ]).then(function([rawNodesText, rawLinksText, rawPresText]) {
            
            const parseCSV = (text) => {
                const firstLine = text.split('\n')[0];
                let delimiter = ',';
                if (firstLine.includes('\t')) delimiter = '\t';
                else if (firstLine.includes(';') && (!firstLine.includes(',') || firstLine.indexOf(';') < firstLine.indexOf(','))) delimiter = ';';
                return d3.dsvFormat(delimiter).parse(text);
            };

            if (rawPresText && rawPresText.trim() !== "") {
                const rawPres = parseCSV(rawPresText);
                rawPres.forEach(row => {
                    const cleanKey = (k) => k.replace(/^\uFEFF/, '').trim().toLowerCase();
                    const d = {};
                    for (let k in row) d[cleanKey(k)] = (row[k] || "").trim();
                    
                    const section = d.section || "";
                    const nodeId = (d.node_id || d.id || "").replace(/\s/g, '');
                    
                    if (section && nodeId) {
                        if (!presentationData[section]) {
                            presentationData[section] = [];
                            thematicSubjects.push(section); 
                        }
                        presentationData[section].push(nodeId);
                    }
                });
            }

            const rawNodes = parseCSV(rawNodesText);
            const rawLinks = parseCSV(rawLinksText);
            const cleanKey = (k) => k.replace(/^\uFEFF/, '').trim().toLowerCase();

            globalNodes = rawNodes.map(obj => {
                const d = {};
                for (let k in obj) d[cleanKey(k)] = (obj[k] || "").trim();

                const extractedDomains = [];
                if (d.domain1 && d.domain1 !== "") extractedDomains.push(d.domain1);
                if (d.domain2 && d.domain2 !== "") extractedDomains.push(d.domain2);
                if (d.domain3 && d.domain3 !== "") extractedDomains.push(d.domain3);
                
                if (extractedDomains.length === 0 && d.domains && d.domains !== "") {
                    d.domains.split("|").forEach(dom => extractedDomains.push(strictNormalize(dom)));
                }

                return {
                    id: (d.id || "").replace(/\s/g, ''),
                    title: d.title || d.id || "Unnamed Node",
                    domains: extractedDomains.length > 0 ? extractedDomains : ["Core"],
                    meta: d.meta || "",
                    desc: d.desc || d.description || "",
                    img: d.img || d.image || ""
                };
            }).filter(n => n.id !== "");

            const validNodeIds = new Set(globalNodes.map(n => n.id));

            globalLinks = rawLinks.map(obj => {
                const d = {};
                for (let k in obj) d[cleanKey(k)] = (obj[k] || "").trim();
                
                return {
                    source: (d.source || "").replace(/\s/g, ''),
                    target: (d.target || "").replace(/\s/g, ''),
                    label: d.label || "relates to",
                    label_reverse: d.label_reverse || d.labelreverse || d.label_reverse || "",
                    category: d.category || "General",
                    strength: parseFloat(d.strength || d.weight) || 1
                };
            }).filter(l => validNodeIds.has(l.source) && validNodeIds.has(l.target));

            initGraph();
            initSearch();
        }).catch(error => {
            console.error("Error loading CSV files:", error);
            document.getElementById('graph-container').innerHTML = `<h2 style="color:white; padding:50px;">Error Loading CSVs. Check console for details.</h2>`;
        });

        function initGraph() {
            const legendContainer = document.getElementById('legend-items');
            
            for(let j=0; j<4; j++) {
                thematicSubjects.forEach((subject, index) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.dataset.index = index; 
                    item.onclick = () => toggleSubjectFilter(subject, index);
                    item.innerHTML = `<div class="legend-number">${index + 1}</div><span>${subject}</span>`;
                    legendContainer.appendChild(item);
                });
            }

            setTimeout(() => {
                topRibbon.scrollLeft = topRibbon.scrollWidth / 4;
            }, 100);

            const degreeMap = {};
            globalLinks.forEach(l => { 
                degreeMap[l.source] = (degreeMap[l.source] || 0) + 1; 
                degreeMap[l.target] = (degreeMap[l.target] || 0) + 1; 
            });

            globalNodes.forEach(n => {
                if (n.id === 'Central_Node' || n.id === 'Cementious_Concrete') {
                    n.size = 50; 
                    n.isHub = false;
                    n.isCentral = true;
                } else {
                    n.size = 12 + ((degreeMap[n.id] || 0) * 2.5); 
                    n.isHub = (degreeMap[n.id] || 0) > 5; 
                    n.isCentral = false;
                }
                
                if (n.domains.length > 1) {
                    const gradId = "grad-" + n.domains.join("").replace(/[^a-zA-Z0-9]/g, '');
                    n.fill = `url(#${gradId})`;
                    n.fallbackColor = domainColors[n.domains[0]] || "#ffffff";
                    if (!document.getElementById(gradId)) {
                        const grad = defs.append("linearGradient").attr("id", gradId);
                        n.domains.forEach((d, i) => grad.append("stop").attr("offset", `${(i / (n.domains.length - 1)) * 100}%`).attr("stop-color", domainColors[d] || "#fff"));
                    }
                } else {
                    n.fill = domainColors[n.domains[0]] || "#ffffff";
                    n.fallbackColor = n.fill;
                }
            });

            window.simulation = d3.forceSimulation(globalNodes)
                .force("link", d3.forceLink(globalLinks).id(d => d.id).distance(240))
                .force("charge", d3.forceManyBody().strength(-2000))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(d => d.size * 1.5 + 25));

            globalLinkPaths = g.append("g").selectAll("path").data(globalLinks).join("path")
                .attr("class", "link-line")
                .attr("stroke-width", d => 1 + (d.strength * 0.5))
                .style("stroke-opacity", d => Math.min(1, 0.4 + (d.strength * 0.1)));

            globalLinkTexts = g.append("g").selectAll("text").data(globalLinks).join("text")
                .attr("class", "link-label").text(d => d.label);

            globalNodeGroups = g.append("g").selectAll("g").data(globalNodes).join("g").attr("class", "node graph-element")
                .call(d3.drag().on("start", dragstart).on("drag", dragged).on("end", dragend))
                .on("click", (e, d) => {
                    if(!presentationQueue.includes(d)) endPresentationMode(); 
                    else presentationIndex = presentationQueue.indexOf(d); 
                    handleNodeClick(d);
                })
                .on("mouseover", (e, d) => handleNodeHover(d))
                .on("mouseout", () => handleNodeOut());

            globalNodeGroups.append("circle").attr("class", "node-circle").attr("r", d => d.size)
                .attr("fill", d => d.fill).attr("stroke", "#ffffff").attr("stroke-width", 2);
                
            globalNodeGroups.append("text").attr("class", "node-label")
                .classed("hub-label", d => d.isHub) 
                .classed("central-node-text", d => d.isCentral) 
                .attr("dx", d => d.size + 15).attr("dy", 6).text(d => d.title);

            simulation.on("tick", () => {
                globalLinkPaths.attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
                globalLinkTexts.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2 - 6)
                    .attr("transform", d => {
                        const angle = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
                        return `rotate(${angle > 90 || angle < -90 ? angle + 180 : angle}, ${(d.source.x + d.target.x) / 2}, ${(d.source.y + d.target.y) / 2})`;
                    });
                globalNodeGroups.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.55).translate(-width/2, -height/2));
            
            window.jumpToNodeUI = (nodeId) => {
                const target = globalNodes.find(n => n.id === nodeId);
                if(target) handleNodeClick(target);
            };
        }

        function initSearch() {
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                searchResults.innerHTML = '';
                
                if (query === '') {
                    searchResults.style.display = 'none';
                    return;
                }
                
                const matches = globalNodes.filter(n => n.title.toLowerCase().includes(query)).slice(0, 8);
                if (matches.length > 0) {
                    searchResults.style.display = 'flex';
                    matches.forEach(m => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerText = m.title;
                        div.onclick = () => {
                            searchInput.value = "";
                            searchResults.style.display = 'none';
                            endPresentationMode();
                            handleNodeClick(m);
                        };
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'none';
                }
            });
            
            document.addEventListener('click', (e) => {
                if(!e.target.closest('#search-container')) {
                    searchResults.style.display = 'none';
                }
            });
        }

        function dragstart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
        function dragend(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

        function toggleSubjectFilter(subject, index) {
            if (currentSubjectFilter === subject) {
                resetGraph();
            } else {
                activateTheme(subject, index);
            }
        }

        function activateTheme(subject, index) {
            endPresentationMode(); 
            currentSubjectFilter = subject;
            let isConclusion = subject.toLowerCase() === "conclusion";

            d3.selectAll('.legend-item').classed('active', false);
            d3.selectAll('.legend-item').filter(function() { return parseInt(this.dataset.index) === index; }).classed('active', true);
            
            const orderedNodeIds = presentationData[subject] || [];
            presentationQueue = [];
            
            orderedNodeIds.forEach(id => {
                const foundNode = globalNodes.find(n => n.id === id);
                if (foundNode) presentationQueue.push(foundNode);
            });

            const activeIds = presentationQueue.map(n => n.id);

            if (isConclusion) {
                d3.selectAll('.graph-element').attr('class', 'node graph-element');
                d3.selectAll('.link-line').attr('class', 'link-line');
                d3.selectAll('.node-label').attr('class', 'node-label').classed('hub-label', d => d.isHub).classed('central-node-text', d => d.isCentral);
            } else {
                d3.selectAll('.graph-element').attr('class', 'node graph-element dimmed');
                d3.selectAll('.link-line').attr('class', 'link-line dimmed');
                d3.selectAll('.link-label').attr('class', 'link-label');
                d3.selectAll('.node-label').attr('class', 'node-label');
                
                globalNodeGroups.filter(n => activeIds.includes(n.id)).classed('dimmed', false).classed('highlighted', true);
                globalLinkPaths.filter(l => activeIds.includes(l.source.id) && activeIds.includes(l.target.id))
                    .classed('dimmed', false)
                    .classed('highlighted-link', true);
                    
                globalNodeGroups.selectAll('.node-label')
                    .classed('central-node-text', d => d.isCentral);
            }
            
            document.getElementById('panel-domain-container').innerHTML = `<div class="domain-tag" style="background:var(--accent); color:#000; border-color:var(--accent)">Thematic Focus</div>`;
            document.getElementById('panel-title').innerText = subject;
            document.getElementById('panel-meta').innerText = `${presentationQueue.length} Primary Nodes in Sequence`;
            document.getElementById('panel-media').classList.remove('active');
            document.getElementById('panel-interdependencies').classList.remove('active');
            
            let descText = themeDescriptions[subject] || "This thematic cluster maps the structural and historical interdependencies defining this aspect of cementitious concrete. Use the arrows below or your keyboard to follow the narrative sequence.";
            let tocHTML = `<p style="margin-bottom: 25px;">${descText}</p>`;
            
            presentationQueue.forEach((node, i) => {
                tocHTML += `
                <div class="toc-item" onclick="presentationIndex=${i}; handleNodeClick(presentationQueue[${i}])">
                    <span class="toc-title">${i+1}. ${node.title}</span>
                    <span class="toc-arrow">→</span>
                </div>`;
            });
            
            document.getElementById('panel-desc').innerHTML = tocHTML;
            document.getElementById('detail-panel').classList.add('active');

            let zoomNodes = isConclusion ? globalNodes : presentationQueue;

            if (zoomNodes.length > 0) {
                const pad = isConclusion ? 100 : 350; 
                const minX = d3.min(zoomNodes, d => d.x) - pad;
                const maxX = d3.max(zoomNodes, d => d.x) + pad;
                const minY = d3.min(zoomNodes, d => d.y) - pad;
                const maxY = d3.max(zoomNodes, d => d.y) + pad;

                const dx = maxX - minX; 
                const dy = maxY - minY;
                
                const viewWidth = width > 800 ? width - 600 : width;
                const viewHeight = height - 120;
                
                const scale = Math.max(0.1, Math.min(1.2, Math.min(viewWidth / dx, viewHeight / dy)));
                
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                const offsetX = width > 800 ? (width - 600) / 2 : width / 2;
                
                svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(offsetX, height/2).scale(scale).translate(-cx, -cy));
            }

            presentationIndex = -1;
            updatePresentationControls();
        }

        document.addEventListener('keydown', (e) => {
            if (presentationQueue.length > 0 || currentSubjectFilter) {
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    e.preventDefault();
                    presNext();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    presPrev();
                }
            }
        });

        function presNext() {
            if (presentationIndex < presentationQueue.length - 1) {
                presentationIndex++;
                handleNodeClick(presentationQueue[presentationIndex]);
            } else if (currentSubjectFilter) {
                let currentThemeIdx = thematicSubjects.indexOf(currentSubjectFilter);
                if (currentThemeIdx !== -1) {
                    let nextIdx = (currentThemeIdx + 1) % thematicSubjects.length;
                    activateTheme(thematicSubjects[nextIdx], nextIdx);
                }
            }
        }

        function presPrev() {
            if (presentationIndex > 0) {
                presentationIndex--;
                handleNodeClick(presentationQueue[presentationIndex]);
            } else if (presentationIndex === 0) {
                activateTheme(currentSubjectFilter, thematicSubjects.indexOf(currentSubjectFilter));
            } else if (presentationIndex === -1 && currentSubjectFilter) {
                let currentThemeIdx = thematicSubjects.indexOf(currentSubjectFilter);
                if (currentThemeIdx !== -1) {
                    let prevIdx = (currentThemeIdx - 1 + thematicSubjects.length) % thematicSubjects.length;
                    activateTheme(thematicSubjects[prevIdx], prevIdx);
                    if (presentationQueue.length > 0) {
                        presentationIndex = presentationQueue.length - 1;
                        handleNodeClick(presentationQueue[presentationIndex]);
                    }
                }
            }
        }

        function updatePresentationControls() {
            const controls = document.getElementById('presentation-controls');
            if (presentationQueue.length > 0 || currentSubjectFilter) {
                controls.classList.add('active');
                
                document.getElementById('btn-prev').disabled = false;
                document.getElementById('btn-next').disabled = false;
                
                if (presentationIndex === -1) {
                    document.getElementById('pres-counter').innerText = `Overview`;
                } else {
                    document.getElementById('pres-counter').innerText = `Node ${presentationIndex + 1} of ${presentationQueue.length}`;
                }
            } else {
                controls.classList.remove('active');
            }
        }

        function endPresentationMode() {
            currentSubjectFilter = null;
            presentationQueue = [];
            presentationIndex = -1;
            document.getElementById('presentation-controls').classList.remove('active');
            d3.selectAll('.legend-item').classed('active', false);
            d3.selectAll('.node-label').classed('large-label', false).classed('medium-label', false);
            d3.selectAll('.force-visible').classed('force-visible', false);
            
            if(globalNodeGroups) {
                globalNodeGroups.selectAll('.node-label').classed('hub-label', d => d.isHub);
            }
        }

        function handleNodeHover(d) {
            if (document.getElementById('detail-panel').classList.contains('active') || currentSubjectFilter) return;
            const connectedLinks = globalLinks.filter(l => l.source.id === d.id || l.target.id === d.id);
            const connectedNodes = [d.id, ...connectedLinks.map(l => l.source.id === d.id ? l.target.id : l.source.id)];
            
            globalNodeGroups.classed('dimmed', n => !connectedNodes.includes(n.id));
            globalLinkPaths.classed('dimmed', true).classed('highlighted-link', false);
            globalLinkPaths.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted-link', true);
            
            globalLinkTexts.filter(l => connectedLinks.includes(l)).classed('show-labels', true);
        }

        function handleNodeOut() {
            if (document.getElementById('detail-panel').classList.contains('active') || currentSubjectFilter) return;
            globalNodeGroups.classed('dimmed', false);
            globalLinkPaths.classed('dimmed', false).classed('highlighted-link', false);
            if (d3.zoomTransform(svg.node()).k <= 1.2) globalLinkTexts.classed('show-labels', false);
        }

        const citeCleaner = new RegExp("\\[c" + "ite:\\s*\\d+\\]", "gi");

        function handleNodeClick(d) {
            try {
                if (presentationQueue.length === 0) {
                    d3.selectAll('.legend-item').classed('active', false);
                } else {
                    updatePresentationControls(); 
                }

                const connectedLinks = globalLinks.filter(l => l.source.id === d.id || l.target.id === d.id);
                const connectedNodes = [d.id, ...connectedLinks.map(l => l.source.id === d.id ? l.target.id : l.source.id)];

                const targetNodesData = globalNodes.filter(n => connectedNodes.includes(n.id));
                const pad = 200;
                const minX = d3.min(targetNodesData, n => n.x) - pad;
                const maxX = d3.max(targetNodesData, n => n.x) + pad;
                const minY = d3.min(targetNodesData, n => n.y) - pad;
                const maxY = d3.max(targetNodesData, n => n.y) + pad;

                const dx = maxX - minX; 
                const dy = maxY - minY;
                
                const viewWidth = width > 800 ? width - 600 : width;
                const viewHeight = height - 120;
                
                const scale = Math.max(0.1, Math.min(1.2, Math.min(viewWidth / dx, viewHeight / dy)));
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                const offsetX = width > 800 ? (width - 600) / 2 : width / 2;
                
                svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(offsetX, height/2).scale(scale).translate(-cx, -cy));

                const activeThemeIds = presentationQueue.map(n => n.id);
                const isConclusion = currentSubjectFilter && currentSubjectFilter.toLowerCase() === "conclusion";

                globalNodeGroups.attr('class', 'node graph-element');
                globalLinkPaths.attr('class', 'link-line');
                
                globalNodeGroups.each(function(n) {
                    const isConnected = connectedNodes.includes(n.id);
                    const isInTheme = activeThemeIds.includes(n.id);
                    
                    let nodeClass = 'node graph-element ';
                    if (isConnected) {
                        nodeClass += 'highlighted force-visible';
                    } else if (currentSubjectFilter && !isConclusion && isInTheme) {
                        nodeClass += 'theme-dimmed'; 
                    } else {
                        nodeClass += 'dimmed'; 
                    }
                    d3.select(this).attr('class', nodeClass);
                });

                globalLinkPaths.classed('dimmed', true).classed('highlighted-link', false).classed('force-visible', false);
                globalLinkPaths.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted-link', true).classed('force-visible', true);
                
                globalLinkTexts.classed('force-visible', false).classed('show-labels', false);
                globalLinkTexts.filter(l => connectedLinks.includes(l)).classed('show-labels', true).classed('force-visible', true);

                globalNodeGroups.selectAll('.node-label')
                    .classed('hub-label', false)
                    .classed('large-label', n => n.id === d.id && !n.isCentral)
                    .classed('medium-label', n => n.id !== d.id && connectedNodes.includes(n.id) && !n.isCentral);

                document.getElementById('panel-domain-container').innerHTML = d.domains.map(dom => `<div class="domain-tag" style="background:${domainColors[dom] || '#ffffff'}33; border-color:${domainColors[dom] || '#ffffff'}">${dom}</div>`).join('');
                document.getElementById('panel-title').innerText = d.title;
                document.getElementById('panel-meta').innerText = d.meta;
                document.getElementById('panel-desc').innerHTML = d.desc.replace(citeCleaner, '');
                
                const mediaContainer = document.getElementById('panel-media');
                const imgElement = document.getElementById('panel-img');
                
                if (d.img && d.img.trim() !== "") {
                    let imagePath = d.img.trim();
                    
                    if (!imagePath.startsWith('http') && !imagePath.toLowerCase().startsWith('images/') && !imagePath.startsWith('data:')) {
                        imagePath = 'Images/' + imagePath;
                    }
                    
                    imgElement.src = imagePath;
                    
                    imgElement.onerror = () => console.error("Image failed to load but was requested:", imagePath);
                    imgElement.onload = () => console.log("Image loaded successfully:", imagePath);
                    
                    mediaContainer.classList.add('active');
                } else {
                    mediaContainer.classList.remove('active');
                }

                document.getElementById('panel-interdependencies').classList.add('active');

                const groupedLinks = {};
                connectedLinks.forEach(l => { 
                    const cat = l.category || "General";
                    (groupedLinks[cat] = groupedLinks[cat] || []).push(l); 
                });

                let linksHTML = "";
                for (const [category, arr] of Object.entries(groupedLinks)) {
                    linksHTML += `<div class="category-header">${category}</div>`;
                    arr.forEach(l => {
                        const isSrc = l.source.id === d.id;
                        const related = isSrc ? l.target : l.source;
                        if(!related || !related.id) return;
                        
                        const verb = isSrc ? l.label : (l.label_reverse || `is ${l.label} by`);
                        
                        linksHTML += `
                        <div class="interdependency-sentence">
                            <span class="node-link" style="color:${d.fallbackColor}" onclick="window.jumpToNodeUI('${d.id}')">${d.title}</span> 
                            <span class="verb-text">${verb}</span> 
                            <span class="node-link" style="color:${related.fallbackColor}" onclick="window.jumpToNodeUI('${related.id}')">${related.title}</span>.
                        </div>`;
                    });
                }
                document.getElementById('panel-links').innerHTML = linksHTML;
                document.getElementById('detail-panel').classList.add('active');
                
            } catch(e) { console.error("Sidebar encountered an error:", e); }
        }

        function resetGraph() {
            endPresentationMode();
            document.getElementById('detail-panel').classList.remove('active');
            d3.selectAll('.graph-element').attr('class', 'node graph-element');
            d3.selectAll('.link-line').attr('class', 'link-line');
            d3.selectAll('.link-label').attr('class', 'link-label');
            d3.selectAll('.node-label').attr('class', 'node-label').classed('hub-label', d => d.isHub).classed('central-node-text', d => d.isCentral);
            
            const visibleNodes = globalNodes;
            if (visibleNodes.length > 0) {
                const pad = 200;
                const minX = d3.min(visibleNodes, n => n.x) - pad;
                const maxX = d3.max(visibleNodes, n => n.x) + pad;
                const minY = d3.min(visibleNodes, n => n.y) - pad;
                const maxY = d3.max(visibleNodes, n => n.y) + pad;

                const dx = maxX - minX; 
                const dy = maxY - minY;
                
                const scale = Math.max(0.05, Math.min(1.0, Math.min(width / dx, height / dy)));
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                
                svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(scale).translate(-cx, -cy));
            }
        }
    </script>
</body>
</html>
