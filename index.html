<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Knowledge Graph | Material Interdependencies</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-primary: #f0f0f0;
            --text-muted: #8a8a8a;
            --accent: #c5a059;
            --panel-bg: rgba(12, 12, 15, 0.95);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #graph-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .node-circle { transition: fill 0.3s, stroke 0.3s; cursor: pointer; }
        .node-label { font-family: 'EB Garamond', serif; font-size: 16px; fill: var(--text-primary); pointer-events: none; text-shadow: 0 4px 12px rgba(0,0,0,1); }
        .link-line { stroke: #444444; stroke-opacity: 0.7; fill: none; }
        .link-label { font-family: 'Inter', sans-serif; font-size: 10px; fill: #aaaaaa; text-transform: uppercase; letter-spacing: 1.5px; pointer-events: none; text-anchor: middle; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .dimmed { opacity: 0.08 !important; transition: opacity 0.5s ease; }
        .highlighted { opacity: 1 !important; transition: opacity 0.5s ease; }
        
        #detail-panel {
            position: absolute; top: 0; right: -700px; width: 550px; height: 100%;
            background: var(--panel-bg); backdrop-filter: blur(20px); border-left: 1px solid #2a2a2a;
            padding: 50px 45px; box-sizing: border-box; transition: right 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            overflow-y: auto; z-index: 100;
        }
        #detail-panel.active { right: 0; }
        
        .close-btn { position: absolute; top: 30px; right: 40px; background: none; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--text-primary); }
        
        .domain-tag { display: inline-block; padding: 5px 12px; border: 1px solid #444; border-radius: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 20px; }
        h1 { font-family: 'EB Garamond', serif; font-size: 2.6rem; font-weight: 400; margin: 0 0 15px 0; line-height: 1.1; }
        .meta-data { font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; line-height: 1.5; text-transform: uppercase; letter-spacing: 1px;}
        
        .media-container { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 30px; border-radius: 4px; overflow: hidden; position: relative; border: 1px solid #333; }
        .media-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
        .media-container img:hover { opacity: 1; }
        
        .content-body { font-size: 1.05rem; line-height: 1.7; font-weight: 300; color: #cccccc; }
        
        .interdependency-list { margin-top: 40px; padding-top: 25px; border-top: 1px solid #333; }
        .interdependency-list h3 { font-family: 'EB Garamond', serif; font-size: 1.6rem; font-weight: 400; margin-bottom: 20px; color: var(--text-primary); }
        .interdependency-card { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
        .relation-tag { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        .relation-target { font-weight: 600; color: #fff; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="graph-container"></div>

    <div id="detail-panel">
        <button class="close-btn" onclick="resetGraph()">×</button>
        <div class="domain-tag" id="panel-domain">Domain</div>
        <h1 id="panel-title">Node Title</h1>
        <div class="meta-data" id="panel-meta"></div>
        
        <div class="media-container">
            <img id="panel-img" src="" alt="Domain Visualization">
        </div>
        
        <div class="content-body" id="panel-desc"></div>
        
        <div class="interdependency-list">
            <h3>Direct Interdependencies</h3>
            <div id="panel-links"></div>
        </div>
    </div>

    <script>
        const data = {
            nodes: [
                { 
                    id: "Concrete_Matrix", group: "Core", size: 10, title: "Portland Cement Concrete", domain: "Multi-Domain", 
                    meta: "The Composite Baseline", 
                    desc: "Concrete is a mineral composite, not a single material, where cement acts as the binder and sand and gravel make up most of the volume[cite: 3]. When water is added, the hydration process begins, binding the aggregates into a solid material with a typical grey appearance[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1518002171953-a080ee817e1f?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Kiln_Calcination", group: "Technical", size: 7, title: "Kiln Calcination", domain: "Technical Domain", 
                    meta: "Energy Intensive Processing (1450°C)", 
                    desc: "The most energy-intensive part of the process where raw materials enter a rotary kiln reaching 1450°C[cite: 3]. This calcination process (CaCO₃ → CaO + CO₂) changes the chemical composition, accounting for about 80% of the volume and roughly 60% of CO₂ emissions[cite: 3]. It requires 3.2–3.5 GJ of thermal energy per tonne of clinker[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1504257121735-02ebcb710034?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Rotary_Kiln", group: "Historical", size: 6, title: "The Rotary Kiln (1885)", domain: "Historical Domain", 
                    meta: "Technological Paradigm Shift", 
                    desc: "Patented by Frederick Ransome in 1885, the rotary kiln allowed material to move continuously through the firing process[cite: 3]. This shifted production from small plants with expensive cement to economies of scale, cheaper cement, and mass construction[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1590059345229-37f26fc198ce?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Territorial_Control", group: "GeoPolitical", size: 7, title: "Territorial Infrastructure", domain: "Geo-political Domain", 
                    meta: "Imperial & Developmental State Expansion", 
                    desc: "During the 19th century, cement became connected to the industrial state, serving as an infrastructure of territorial control[cite: 3]. It was used to build ports, docks, military installations, and railways to connect mines to export markets and control colonial territories[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1586528116311-ad8ed745eb33?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Steel_Reinforcement", group: "Scientific", size: 8, title: "Strain Compatibility", domain: "Scientific & Technical Domain", 
                    meta: "Composite Mechanics", 
                    desc: "Concrete has a high compressive strength but a low tensile strength (approximately 10% of compressive capacity), making it brittle and prone to cracking[cite: 3]. Steel reinforcement resolves this because both materials share nearly identical coefficients of thermal expansion[cite: 3]. They bond to create 'strain compatibility', allowing them to deform together under load[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1533727763132-75ebff00c3b8?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Recycled_Aggregate", group: "Ecological", size: 6, title: "RCA Recovery Limitations", domain: "Ecological Domain", 
                    meta: "End of Life Processing", 
                    desc: "At the end of life, concrete rubble can be crushed into Recycled Concrete Aggregate (RCA)[cite: 3]. However, technical recycling challenges arise because old cement paste alters workability and strength, and embedded steel reinforcement must be separated[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1611273426858-450d8e3c9cce?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Carbon_Economy", group: "GeoPolitical", size: 7, title: "The Carbon Geopolitics", domain: "Geo-political & Ecological", 
                    meta: "Contemporary Political Economy", 
                    desc: "Because heating limestone chemically releases CO₂ during calcination, decarbonizing fuel cannot eliminate all emissions[cite: 3]. This environmental problem has created a new political economy centered around carbon taxes, emissions trading, and green public procurement[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1480796927426-f609979314bd?auto=format&fit=crop&w=1000&q=80" 
                },
                { 
                    id: "Sensory_Mass", group: "Sensory", size: 6, title: "Sensory Mass Properties", domain: "Sensory & Scientific", 
                    meta: "Optical, Thermal, and Acoustic Manifestation", 
                    desc: "Concrete's high material density yields excellent sound insulation, while its thermal mass allows it to store and release heat over time[cite: 3]. Visually, its grey colour and reflectance (~40% for smooth surfaces) change based on weathering, carbonation, and the exposure of aggregates[cite: 3].", 
                    img: "https://images.unsplash.com/photo-1524311583145-d5593bd3502a?auto=format&fit=crop&w=1000&q=80" 
                }
            ],
            // Links now feature explicit directional verbs to clarify interdependencies
            links: [
                { source: "Concrete_Matrix", target: "Kiln_Calcination", label: "necessitates" },
                { source: "Rotary_Kiln", target: "Kiln_Calcination", label: "industrialized" },
                { source: "Rotary_Kiln", target: "Territorial_Control", label: "enabled mass scale for" },
                { source: "Kiln_Calcination", target: "Carbon_Economy", label: "chemically generates" },
                { source: "Concrete_Matrix", target: "Steel_Reinforcement", label: "relies on for tension" },
                { source: "Steel_Reinforcement", target: "Recycled_Aggregate", label: "contaminates recovery of" },
                { source: "Concrete_Matrix", target: "Recycled_Aggregate", label: "is demolished into" },
                { source: "Concrete_Matrix", target: "Sensory_Mass", label: "physically manifests as" },
                { source: "Territorial_Control", target: "Concrete_Matrix", label: "demanded rapid use of" }
            ]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;

        const zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", (event) => g.attr("transform", event.transform));
        const svg = d3.select("#graph-container").append("svg").attr("width", width).attr("height", height).call(zoom);
        const g = svg.append("g");

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(280))
            .force("charge", d3.forceManyBody().strength(-2000))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(85));

        const link = g.append("g").selectAll("path").data(data.links).join("path").attr("class", "link-line graph-element")
            .attr("stroke-width", 2);
            
        const linkText = g.append("g").selectAll("text").data(data.links).join("text").attr("class", "link-label graph-element").text(d => d.label);

        const node = g.append("g").selectAll("g").data(data.nodes).join("g").attr("class", "node graph-element")
            .call(d3.drag()
                .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
            .on("click", handleNodeClick);

        node.append("circle")
            .attr("class", "node-circle")
            .attr("r", d => d.size)
            .attr("fill", d => d.group === "Core" ? "var(--accent)" : "#0a0a0c")
            .attr("stroke", d => d.group === "Core" ? "var(--accent)" : "#ffffff")
            .attr("stroke-width", d => d.group === "Core" ? 0 : 2);

        node.append("text").attr("class", "node-label").attr("dx", 20).attr("dy", 5).text(d => d.title);

        simulation.on("tick", () => {
            link.attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
            linkText.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2 - 8)
                .attr("transform", d => {
                    const angle = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
                    const x = (d.source.x + d.target.x) / 2;
                    const y = (d.source.y + d.target.y) / 2;
                    return `rotate(${angle > 90 || angle < -90 ? angle + 180 : angle}, ${x}, ${y})`;
                });
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function handleNodeClick(event, d) {
            svg.transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(width / 3.5, height / 2).scale(1.1).translate(-d.x, -d.y));

            const connectedLinks = data.links.filter(l => l.source.id === d.id || l.target.id === d.id);
            const connectedNodes = [d.id, ...connectedLinks.map(l => l.source.id === d.id ? l.target.id : l.source.id)];

            d3.selectAll('.graph-element').classed('dimmed', true).classed('highlighted', false);
            node.filter(n => connectedNodes.includes(n.id)).classed('dimmed', false).classed('highlighted', true);
            link.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted', true);
            linkText.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted', true);

            document.getElementById('panel-domain').innerText = d.domain;
            document.getElementById('panel-title').innerText = d.title;
            document.getElementById('panel-meta').innerText = d.meta;
            document.getElementById('panel-img').src = d.img;
            document.getElementById('panel-desc').innerHTML = d.desc;

            const listEl = document.getElementById('panel-links');
            listEl.innerHTML = "";
            connectedLinks.forEach(l => {
                const isSource = l.source.id === d.id;
                const relatedNode = isSource ? l.target : l.source;
                // Clearly format the cause-and-effect relationship for the panel
                const relationVerb = l.label;
                
                listEl.innerHTML += `
                <div class="interdependency-card">
                    <span class="relation-tag">${isSource ? 'This Node' : relatedNode.title} ${relationVerb}</span>
                    <div class="relation-target">${isSource ? relatedNode.title : 'This Node'}</div>
                </div>`;
            });

            document.getElementById('detail-panel').classList.add('active');
        }

        function resetGraph() {
            document.getElementById('detail-panel').classList.remove('active');
            d3.selectAll('.graph-element').classed('dimmed', false).classed('highlighted', false);
            svg.transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.85).translate(-width/2, -height/2));
        }
    </script>
</body>
</html>
