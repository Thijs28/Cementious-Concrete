<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scroll</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 300vw; 
        }
        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-family: Arial, sans-serif;
            color: white;
        }
        #box1 { background-color: #e63946; }
        #box2 { background-color: #457b9d; }
        #box3 { background-color: #2a9d8f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section" id="box1">Page 1 (Scroll Right ➔)</div>
        <div class="section" id="box2">Page 2</div>
        <div class="section" id="box3">Page 3</div>
    </div>
</body>
</html>
