<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Knowledge Graph | Material Literacy</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0c10; --text-primary: #e0e6ed; --text-muted: #8b929a; --panel-bg: rgba(11, 12, 16, 0.96); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #graph-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .node-circle { transition: stroke 0.3s, r 0.3s; cursor: pointer; }
        .node-circle:hover { stroke: #ffffff !important; stroke-width: 2.5px !important; }
        .node-label { font-family: 'EB Garamond', serif; font-size: 14px; fill: var(--text-primary); pointer-events: none; text-shadow: 0 4px 12px rgba(0,0,0,1); transition: opacity 0.3s; }
        .link-line { stroke: #2a2d34; stroke-opacity: 0.6; fill: none; transition: stroke-opacity 0.3s, stroke 0.3s; }
        .link-label { font-family: 'Inter', sans-serif; font-size: 9px; fill: #7a8288; text-transform: uppercase; letter-spacing: 1.5px; pointer-events: none; text-anchor: middle; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.3s; }
        
        .show-labels { opacity: 1 !important; }
        .dimmed { opacity: 0.04 !important; transition: opacity 0.4s ease; filter: grayscale(100%); pointer-events: none; }
        .highlighted { opacity: 1 !important; transition: opacity 0.4s ease; }
        .highlighted-link { stroke: #666 !important; stroke-opacity: 0.9 !important; stroke-width: 1.5px !important; }
        
        /* New class to smoothly hide undated nodes during timeline view */
        .hidden-timeline { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.5s ease; }
        
        .axis line, .axis path { stroke: #333; }
        .axis text { fill: #888; font-family: 'Inter', sans-serif; font-size: 14px; }
        
        #ui-layer { position: absolute; bottom: 40px; left: 40px; display: flex; gap: 20px; z-index: 50; align-items: flex-end; }
        #legend { background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(15px); border: 1px solid #1f2229; border-radius: 8px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 180px; }
        .legend-title { font-family: 'EB Garamond', serif; color: var(--text-primary); font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid #1f2229; padding-bottom: 8px; }
        .legend-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.2s; }
        .legend-item:hover { color: #fff; transform: translateX(5px); }
        .legend-item.active { color: #fff; font-weight: 600; }
        .legend-color { width: 14px; height: 14px; border-radius: 50%; }

        .btn-toggle { background: #D4AF37; color: #000; border: none; padding: 15px 25px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: all 0.3s; height: fit-content; }
        .btn-toggle:hover { background: #e5c158; transform: translateY(-2px); }

        #detail-panel { position: absolute; top: 0; right: -750px; width: 600px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(20px); border-left: 1px solid #1f2229; padding: 50px 45px; box-sizing: border-box; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1); overflow-y: auto; z-index: 100; box-shadow: -15px 0 40px rgba(0,0,0,0.9); }
        #detail-panel.active { right: 0; }
        .close-btn { position: absolute; top: 30px; right: 40px; background: none; border: none; color: var(--text-muted); font-size: 32px; cursor: pointer; }
        .close-btn:hover { color: var(--text-primary); }
        
        .domain-tag { display: inline-block; padding: 6px 14px; border: 1px solid #333; border-radius: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #fff; margin-bottom: 20px; margin-right: 8px;}
        h1 { font-family: 'EB Garamond', serif; font-size: 2.8rem; font-weight: 400; margin: 0 0 15px 0; }
        .meta-data { font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid #1f2229; padding-bottom: 20px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;}
        .media-container { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 30px; border-radius: 6px; overflow: hidden; border: 1px solid #1f2229; }
        .media-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
        .content-body { font-size: 1.05rem; line-height: 1.7; font-weight: 300; color: #c4c9d0; }
        
        .interdependency-list { margin-top: 40px; padding-top: 25px; border-top: 1px solid #1f2229; }
        .interdependency-list h3 { font-family: 'EB Garamond', serif; font-size: 1.6rem; font-weight: 400; margin-bottom: 15px; }
        .category-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #6a737d; border-bottom: 1px solid #1f2229; padding-bottom: 5px; margin: 25px 0 15px 0; }
        .interdependency-sentence { background: rgba(255,255,255,0.02); border: 1px solid #1f2229; padding: 18px; border-radius: 6px; margin-bottom: 12px; font-size: 1.05rem; line-height: 1.6; color: #a0a5ab; transition: background 0.2s; }
        .interdependency-sentence:hover { background: rgba(255,255,255,0.04); border-color: #3b4048; }
        .node-link { font-weight: 600; cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.3); padding-bottom: 2px; }
        .verb-text { font-style: italic; margin: 0 4px; color: #7a8288; }
    </style>
</head>
<body>

    <div id="graph-container"></div>
    
    <div id="ui-layer">
        <div id="legend">
            <div class="legend-title">Domains</div>
            <div id="legend-items"></div>
        </div>
        <button id="timelineToggle" class="btn-toggle">View Chronology</button>
    </div>

    <div id="detail-panel">
        <button class="close-btn" onclick="resetGraph()">×</button>
        <div id="panel-domain-container"></div>
        <h1 id="panel-title"></h1>
        <div class="meta-data" id="panel-meta"></div>
        <div class="media-container"><img id="panel-img" src="" alt="Data"></div>
        <div class="content-body" id="panel-desc"></div>
        <div class="interdependency-list">
            <h3>Key Interdependencies</h3>
            <div id="panel-links"></div>
        </div>
    </div>

    <script>
        const domainColors = { "Core": "#D4AF37", "Scientific": "#5D8AA8", "Technical": "#CD7F32", "Historical": "#8B9A9A", "GeoPolitical": "#B24C4C", "Ecological": "#4A7A59", "Sensory": "#7A5C7A" };
        
        let currentDomainFilter = null;
        let isTimelineMode = false;
        
        const width = window.innerWidth;
        const height = window.innerHeight;

        const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", (event) => {
            g.attr("transform", event.transform);
            d3.selectAll('.link-label').classed('show-labels', event.transform.k > 1.2);
            if (isTimelineMode) xAxisGroup.attr("transform", `translate(0, ${height/2 + 150})`);
        });
        
        const svg = d3.select("#graph-container").append("svg").attr("width", width).attr("height", height).call(zoom);
        const g = svg.append("g");
        const defs = svg.append("defs");
        const xAxisGroup = g.append("g").attr("class", "axis").style("opacity", 0);

        Promise.all([
            d3.csv("nodes.csv"),
            d3.csv("links.csv")
        ]).then(function([rawNodes, rawLinks]) {
            
            const nodes = rawNodes.map(d => {
                const extractedDomains = [];
                if (d.domain1 && d.domain1.trim() !== "") extractedDomains.push(d.domain1.trim());
                if (d.domain2 && d.domain2.trim() !== "") extractedDomains.push(d.domain2.trim());

                return {
                    id: d.id.trim(),
                    title: d.title.trim(),
                    domains: extractedDomains.length > 0 ? extractedDomains : ["Core"],
                    meta: d.meta,
                    desc: d.desc,
                    img: d.img,
                    // If no year exists, return null instead of a fallback date
                    year: (d.year && d.year.trim() !== "") ? parseInt(d.year) : null
                };
            });

            const links = rawLinks.map(d => ({
                source: d.source.trim(),
                target: d.target.trim(),
                label: d.label.trim(),
                category: d.category.trim()
            }));

            initGraph(nodes, links);
        }).catch(error => {
            console.error("Error loading CSV files. Ensure you are running a local server or viewing on GitHub Pages.", error);
            document.getElementById('graph-container').innerHTML = `<h2 style="color:white; padding:50px;">Error Loading CSVs. <br><br>If testing locally, you must run a local web server (e.g. VSCode Live Server) to fetch files.</h2>`;
        });

        function initGraph(nodes, links) {
            const legendContainer = document.getElementById('legend-items');
            for (const [domain, color] of Object.entries(domainColors)) {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.id = 'legend-' + domain;
                item.onclick = () => toggleDomainFilter(domain, nodes, links);
                item.innerHTML = `<div class="legend-color" style="background:${color}"></div><span>${domain}</span>`;
                legendContainer.appendChild(item);
            }

            const degreeMap = {};
            links.forEach(l => { degreeMap[l.source] = (degreeMap[l.source] || 0) + 1; degreeMap[l.target] = (degreeMap[l.target] || 0) + 1; });

            nodes.forEach(n => {
                n.size = 10 + ((degreeMap[n.id] || 0) * 2.5);
                if (n.domains.length > 1) {
                    const gradId = "grad-" + n.domains.join("");
                    n.fill = `url(#${gradId})`;
                    n.fallbackColor = domainColors[n.domains[0]];
                    if (!document.getElementById(gradId)) {
                        const grad = defs.append("linearGradient").attr("id", gradId);
                        n.domains.forEach((d, i) => grad.append("stop").attr("offset", `${(i / (n.domains.length - 1)) * 100}%`).attr("stop-color", domainColors[d] || "#fff"));
                    }
                } else {
                    n.fill = domainColors[n.domains[0]] || "#ffffff";
                    n.fallbackColor = n.fill;
                }
            });

            window.simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(240))
                .force("charge", d3.forceManyBody().strength(-2000))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(d => d.size * 1.5 + 25));

            const linkPaths = g.append("g").selectAll("path").data(links).join("path").attr("class", "link-line").attr("stroke-width", 1.5);
            const linkTexts = g.append("g").selectAll("text").data(links).join("text").attr("class", "link-label").text(d => d.label);

            const nodeGroups = g.append("g").selectAll("g").data(nodes).join("g").attr("class", "node graph-element")
                .call(d3.drag().on("start", dragstart).on("drag", dragged).on("end", dragend))
                .on("click", (e, d) => handleNodeClick(d, nodes, links, linkPaths, linkTexts, nodeGroups))
                .on("mouseover", (e, d) => handleNodeHover(d, links, nodeGroups, linkPaths, linkTexts))
                .on("mouseout", () => handleNodeOut(nodeGroups, linkPaths, linkTexts));

            nodeGroups.append("circle").attr("class", "node-circle").attr("r", d => d.size)
                .attr("fill", d => d.fill).attr("stroke", d => d.fill.includes("url") ? "#ffffff" : d.fill).attr("stroke-width", d => d.domains.includes("Core") ? 0 : 1.5);
            nodeGroups.append("text").attr("class", "node-label").attr("dx", d => d.size + 12).attr("dy", 5).text(d => d.title);

            simulation.on("tick", () => {
                linkPaths.attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
                linkTexts.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2 - 6)
                    .attr("transform", d => {
                        const angle = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
                        return `rotate(${angle > 90 || angle < -90 ? angle + 180 : angle}, ${(d.source.x + d.target.x) / 2}, ${(d.source.y + d.target.y) / 2})`;
                    });
                nodeGroups.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            // Adjust X-axis to focus purely on historical dates available in data
            const xScale = d3.scaleLinear().domain([1800, 2030]).range([-width, width * 2]);
            const xAxis = d3.axisBottom(xScale).tickFormat(d3.format("d")).ticks(10);
            xAxisGroup.call(xAxis);

            document.getElementById('timelineToggle').addEventListener('click', function() {
                isTimelineMode = !isTimelineMode;
                this.innerText = isTimelineMode ? "View Network Matrix" : "View Chronology";
                
                if (isTimelineMode) {
                    xAxisGroup.transition().duration(1000).style("opacity", 1);
                    
                    // Filter out nodes without a year and their connected links
                    nodeGroups.filter(d => d.year === null).classed('hidden-timeline', true);
                    linkPaths.filter(l => l.source.year === null || l.target.year === null).classed('hidden-timeline', true);
                    linkTexts.filter(l => l.source.year === null || l.target.year === null).classed('hidden-timeline', true);

                    // Apply layout forces ONLY to nodes with a year
                    simulation
                        .force("x", d3.forceX(d => d.year !== null ? xScale(d.year) : 0).strength(d => d.year !== null ? 1 : 0))
                        .force("y", d3.forceY(height / 2).strength(d => d.year !== null ? 0.1 : 0))
                        .force("center", null)
                        .alpha(1).restart();
                        
                    svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.4).translate(-width/2, -height/2));
                } else {
                    xAxisGroup.transition().duration(1000).style("opacity", 0);
                    
                    // Restore visibility to all elements
                    nodeGroups.classed('hidden-timeline', false);
                    linkPaths.classed('hidden-timeline', false);
                    
                    simulation
                        .force("x", null).force("y", null)
                        .force("center", d3.forceCenter(width / 2, height / 2))
                        .alpha(1).restart();
                }
            });

            svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.55).translate(-width/2, -height/2));
            
            window.jumpToNodeUI = (nodeId) => {
                const target = nodes.find(n => n.id === nodeId);
                if(target) handleNodeClick(target, nodes, links, linkPaths, linkTexts, nodeGroups);
            };
        }

        function dragstart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
        function dragend(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

        function toggleDomainFilter(domain, nodes, links) {
            document.getElementById('detail-panel').classList.remove('active');
            if (currentDomainFilter === domain) {
                currentDomainFilter = null;
                d3.selectAll('.legend-item').classed('active', false);
                d3.selectAll('.graph-element:not(.hidden-timeline)').classed('dimmed', false).classed('highlighted', false);
            } else {
                currentDomainFilter = domain;
                d3.selectAll('.legend-item').classed('active', false);
                document.getElementById('legend-' + domain).classList.add('active');
                
                d3.selectAll('.graph-element').classed('dimmed', true).classed('highlighted', false);
                d3.selectAll('.node:not(.hidden-timeline)').filter(n => n.domains.includes(domain)).classed('dimmed', false).classed('highlighted', true);
                d3.selectAll('.link-line:not(.hidden-timeline)').filter(l => l.source.domains.includes(domain) && l.target.domains.includes(domain)).classed('dimmed', false);
                
                const domainNodes = nodes.filter(n => n.domains.includes(domain));
                if (domainNodes.length > 0 && !isTimelineMode) {
                    const cx = (d3.min(domainNodes, d => d.x) + d3.max(domainNodes, d => d.x)) / 2;
                    const cy = (d3.min(domainNodes, d => d.y) + d3.max(domainNodes, d => d.y)) / 2;
                    svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.8).translate(-cx, -cy));
                }
            }
        }

        function handleNodeHover(d, links, nodeGroups, linkPaths, linkTexts) {
            if (document.getElementById('detail-panel').classList.contains('active') || currentDomainFilter) return;
            const connectedLinks = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            const connectedNodes = [d.id, ...connectedLinks.map(l => l.source.id === d.id ? l.target.id : l.source.id)];
            
            nodeGroups.classed('dimmed', n => !connectedNodes.includes(n.id));
            linkPaths.classed('dimmed', true); linkTexts.classed('show-labels', false);
            linkPaths.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted-link', true);
            
            // Only show link text if the link itself is not hidden by timeline mode
            linkTexts.filter(l => connectedLinks.includes(l) && !d3.select(l).classed('hidden-timeline')).classed('show-labels', true);
        }

        function handleNodeOut(nodeGroups, linkPaths, linkTexts) {
            if (document.getElementById('detail-panel').classList.contains('active') || currentDomainFilter) return;
            nodeGroups.classed('dimmed', false);
            linkPaths.classed('dimmed', false).classed('highlighted-link', false);
            if (d3.zoomTransform(svg.node()).k <= 1.2) linkTexts.classed('show-labels', false);
        }

        const citeCleaner = new RegExp("\\[c" + "ite: \\d+\\]", "g");

        function handleNodeClick(d, nodes, links, linkPaths, linkTexts, nodeGroups) {
            currentDomainFilter = null; d3.selectAll('.legend-item').classed('active', false);
            svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width/4, height/2).scale(1.2).translate(-d.x, -d.y));

            const connectedLinks = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            const connectedNodes = [d.id, ...connectedLinks.map(l => l.source.id === d.id ? l.target.id : l.source.id)];

            nodeGroups.classed('dimmed', n => !connectedNodes.includes(n.id));
            linkPaths.classed('dimmed', true).classed('highlighted-link', false);
            linkPaths.filter(l => connectedLinks.includes(l)).classed('dimmed', false).classed('highlighted-link', true);
            
            linkTexts.filter(l => connectedLinks.includes(l) && !d3.select(l).classed('hidden-timeline')).classed('show-labels', true);

            document.getElementById('panel-domain-container').innerHTML = d.domains.map(dom => `<div class="domain-tag" style="background:${domainColors[dom]}33; border-color:${domainColors[dom]}">${dom}</div>`).join('');
            document.getElementById('panel-title').innerText = d.title;
            document.getElementById('panel-meta').innerText = d.meta;
            document.getElementById('panel-img').src = d.img;
            document.getElementById('panel-desc').innerHTML = d.desc.replace(citeCleaner, '');

            const groupedLinks = {};
            connectedLinks.forEach(l => { (groupedLinks[l.category] = groupedLinks[l.category] || []).push(l); });

            let linksHTML = "";
            for (const [category, arr] of Object.entries(groupedLinks)) {
                linksHTML += `<div class="category-header">${category}</div>`;
                arr.forEach(l => {
                    const isSrc = l.source.id === d.id;
                    const related = isSrc ? l.target : l.source;
                    linksHTML += `<div class="interdependency-sentence"><span class="node-link" style="color:${d.fallbackColor}" onclick="window.jumpToNodeUI('${related.id}')">${d.title}</span> <span class="verb-text">${isSrc ? l.label : "is "+l.label+" by"}</span> <span class="node-link" style="color:${related.fallbackColor}" onclick="window.jumpToNodeUI('${related.id}')">${related.title}</span>.</div>`;
                });
            }
            document.getElementById('panel-links').innerHTML = linksHTML;
            document.getElementById('detail-panel').classList.add('active');
        }

        function resetGraph() {
            document.getElementById('detail-panel').classList.remove('active');
            d3.selectAll('.graph-element').classed('dimmed', false).classed('highlighted', false).classed('highlighted-link', false);
            svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.55).translate(-width/2, -height/2));
            d3.selectAll('.link-label').classed('show-labels', false);
        }
    </script>
</body>
</html>
